[algokit]
min_version = "v2.0.0"

[generate.smart-contract]
description = "Generate a new smart contract for existing project"
path = ".algokit/generators/create_contract"

[generate.env-file]
description = "Generate a new generic or Algorand network specific .env file"
path = ".algokit/generators/create_env_file"

[project]
type = 'contract'
name = 'refugee-identity-system'
# Blockchain moved into Nexathon for full integration
artifacts = 'Nexathon/blockchain/artifacts'

[project.deploy]
# PYTHONPATH so blockchain package (Nexathon/blockchain) is found — use env (AlgoKit resolves the first token as the executable)
command = "env PYTHONPATH=Nexathon poetry run python -m blockchain deploy"

[project.deploy.testnet]
environment_secrets = [
  "DEPLOYER_MNEMONIC",
]

[project.deploy.mainnet]
environment_secrets = [
  "DEPLOYER_MNEMONIC",
]

[project.run]
# Commands intented for use locally and in CI
build = { commands = [
  'env PYTHONPATH=Nexathon poetry run python -m blockchain build',
], description = 'Build all smart contracts in the project' }
test = { commands = [
  'poetry run pytest tests/ -v',
], description = 'Run integration tests (requires LocalNet: algokit localnet start)' }
lint = { commands = [
], description = 'Perform linting' }
audit-teal = { commands = [
  # 🚨 IMPORTANT 🚨: For strict TEAL validation, remove --exclude statements. The default starter contract is not for production. Ensure thorough testing and adherence to best practices in smart contract development. This is not a replacement for a professional audit.
  'algokit task analyze Nexathon/blockchain/artifacts --recursive --force --exclude rekey-to --exclude is-updatable --exclude missing-fee-check --exclude is-deletable --exclude can-close-asset --exclude can-close-account --exclude unprotected-deletable --exclude unprotected-updatable',
], description = 'Audit TEAL files' }

# Commands intented for CI only, prefixed with `ci-` by convention
ci-teal-diff = { commands = [
  'git add -N ./Nexathon/blockchain/artifacts',
  'git diff --exit-code --minimal ./Nexathon/blockchain/artifacts',
], description = 'Check TEAL files for differences' }
